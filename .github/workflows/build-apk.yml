name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source (no stored GitHub credentials)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup maintained JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (no obsolete tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Security guardrails - deny network and dangerous code
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/AndroidManifest.xml
          if grep -R -nE 'android.permission.INTERNET|android.permission.RECEIVE_BOOT_COMPLETED|android.permission.REQUEST_INSTALL_PACKAGES|android.permission.QUERY_ALL_PACKAGES|DexClassLoader|PathClassLoader|java.net.|HttpURLConnection|ProcessBuilder|Runtime.getRuntime|WebView|WebSocket' app/src/main; then
            echo 'Unapproved networking, dynamic execution, package-install or boot permission found' >&2
            exit 1
          fi
          grep -q 'android.permission.BIND_VPN_SERVICE' app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          echo 'Source permission and network checks passed'

      - name: Test IPv4 rule parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-test
          javac -d .ci-test app/src/main/java/org/local/xcpeguard/IpRules.java tests/RuleValidationTest.java
          java -cp .ci-test RuleValidationTest

      - name: Compile Android APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK permissions and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          if grep -q 'android.permission.INTERNET' apk-permissions.txt; then
            echo 'Security check FAILED: APK declares INTERNET permission' >&2
            exit 1
          fi
          sha256sum "$APK" | tee app-debug.apk.sha256
          echo 'Verified APK has no INTERNET permission'

      - name: Upload tested APK
        uses: actions/upload-artifact@v7
        with:
          name: XCPE-Route-Guard-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            apk-permissions.txt
          if-no-files-found: error
          retention-days: 30
