plugins { id 'com.android.application' }

android {
    namespace 'org.local.xcpeguard'
    compileSdk 35

    defaultConfig {
        applicationId 'org.local.xcpeguard'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '0.1.0-ip-only'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
